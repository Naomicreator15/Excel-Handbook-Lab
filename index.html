<!doctype html>
<html lang="en">
<head>
<title>Excel Handbook Lab</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky app header with progress ring, tab bar, one working panel at a time. Spreadsheet vocabulary (cell addresses, formula bar, status bar) is the visual language. */
:root{
  --bg:#f3f7f4; --panel:#ffffff; --ink:#10231a; --muted:#5d7167; --line:#d5e0d9; --accent:#16794b; --accent-ink:#ffffff;
  --accent-soft:#e1f1e8; --hi:#ffe9a8; --bad:#b3261e; --bad-soft:#fde8e6; --good:#16794b; --head:#e9efeb; --sel:#d9ecff; --selline:#2a7bd6;
  --disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --panel:#16211b; --ink:#e6f1ea; --muted:#9bb0a4; --line:#2a3a31; --accent:#4cc38a; --accent-ink:#06150d;
  --accent-soft:#1c3328; --hi:#5a4a10; --bad:#ff8a80; --bad-soft:#3a1d1b; --good:#4cc38a; --head:#1d2b24; --sel:#17304d; --selline:#6bb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --panel:#16211b; --ink:#e6f1ea; --muted:#9bb0a4; --line:#2a3a31; --accent:#4cc38a; --accent-ink:#06150d;
  --accent-soft:#1c3328; --hi:#5a4a10; --bad:#ff8a80; --bad-soft:#3a1d1b; --good:#4cc38a; --head:#1d2b24; --sel:#17304d; --selline:#6bb0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:22px 0 14px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.4vw,38px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin-top:6px;max-width:46ch}
.sub a{color:var(--accent);font-weight:600}
.rank{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.ring{width:58px;height:58px;position:relative;flex:none}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px}
.rank small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.rank strong{font-family:var(--disp);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
nav button{font:600 15px var(--body);background:none;border:0;color:var(--muted);padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--selline);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h2{font-family:var(--disp);font-size:22px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:6px}
.group{font:600 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* quiz */
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px;font-family:var(--mono)}
.bar{height:8px;background:var(--head);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt.right{background:var(--accent-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);animation:pop .25s}
.why.no{background:var(--bad-soft)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.score{font-family:var(--disp);font-size:44px;font-weight:800;margin:6px 0}
/* sheet */
.xl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.fbar{display:flex;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;min-height:34px}
.fbar .nb{width:110px;border-right:1px solid var(--line);padding:7px 10px;font-weight:600;flex:none}
.fbar .fx{padding:7px 10px;color:var(--muted);border-right:1px solid var(--line);font-style:italic;flex:none}
.fbar .fv{padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.scroll{overflow:auto;max-height:430px}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;min-width:900px}
table.g th,table.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap;height:28px}
table.g thead th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:600;color:var(--muted);text-align:center}

table.g th.rn.f{color:var(--selline);font-weight:600}
td{cursor:cell;user-select:none}
td.sel{background:var(--sel)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.title{font-family:var(--disp);font-weight:800;font-size:15px;background:var(--accent-soft);cursor:default}
tr.hd td{background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:default;position:sticky;top:28px;z-index:2}
.hbtn{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
.hbtn.fl{margin-left:6px;opacity:.85;border:1px solid currentColor;border-radius:4px;padding:0 5px;font-size:11px}
.hbtn.fl.on{background:var(--hi);color:#000;opacity:1}
.sb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent);color:var(--accent-ink);padding:6px 12px;font-size:13px;font-family:var(--mono)}
.pop{position:absolute;z-index:20;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;min-width:200px;max-height:300px;overflow:auto;font-family:var(--body)}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;font-weight:400}
.pop input[type=number]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.tasks{display:grid;gap:10px;margin-top:16px}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.task.done{border-color:var(--good);background:var(--accent-soft)}
.task .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.task input{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px var(--mono)}
.fb{font-size:13px;margin-top:6px;color:var(--muted)}
/* lab */
.fin{width:100%;font:600 18px var(--mono);padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fin:focus{border-color:var(--accent);outline:none}
.res{margin-top:12px;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);min-height:84px}
.res .v{font:800 30px var(--disp);word-break:break-word}
.res.err{background:var(--bad-soft);border-color:var(--bad)}
.res.err .v{color:var(--bad)}
.tag{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-size:12px;font-family:var(--mono)}
.cols span{background:var(--head);border-radius:6px;padding:3px 8px}
.cols b{color:var(--accent)}
.mis{display:grid;gap:8px;margin-top:14px}
.m{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.m.done{border-color:var(--good);background:var(--accent-soft)}
.m.cur{outline:2px solid var(--selline)}
.m .n{font:600 13px var(--mono);width:26px;height:26px;border-radius:50%;background:var(--head);display:flex;align-items:center;justify-content:center;flex:none}
.m.done .n{background:var(--good);color:var(--accent-ink)}
code{font-family:var(--mono);background:var(--head);padding:1px 6px;border-radius:5px;font-size:.92em}
/* cards */
.deck{perspective:1000px;max-width:520px;margin:10px auto}
.card{height:220px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:2px solid var(--line)}
.face.f{background:var(--bg)}
.face.b{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);border-color:var(--accent)}
.face .k{font:800 clamp(24px,5vw,34px) var(--mono)}
.face .p{font:600 21px var(--disp);text-wrap:balance}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){.split.two{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}}
</style>
</head>

<div class="wrap">
<header>
  <div>
    <h1>Excel Handbook Lab</h1>
    <p class="sub">Practice what you read. Quiz yourself, sort and filter real Zenith sales data, write formulas that run, and drill the shortcuts. Companion to the <a href="handbook.html" target="_blank" rel="noopener">Microsoft Excel Beginner Handbook</a>.</p>
  </div>
  <div class="rank" aria-live="polite">
    <div class="ring"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="var(--head)" stroke-width="7"/><circle id="ringc" cx="29" cy="29" r="25" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157"/></svg><b id="pct">0%</b></div>
    <div><small>Your level</small><strong id="rank">Newcomer</strong><small id="next"></small></div>

</header>

<script>
"use strict";
/* ---------- data: the 30 Zenith orders from Chapter 7 ---------- */
const RAW=`ORD-001|05/01/2024|Emeka Okafor|Lagos|Electronics|Bluetooth Speaker|12|15500|Completed
ORD-002|07/01/2024|Naomi Ajah|Abuja|Groceries|Premium Rice (25kg)|20|18000|Completed
ORD-003|09/01/2024|Chidi Nwosu|Port Harcourt|Clothing|Men's Work Suit|5|45000|Pending
ORD-004|11/01/2024|Funke Adeleke|Kano|Household|Standing Fan|10|12000|Completed
ORD-005|15/01/2024|Emeka Okafor|Lagos|Electronics|Wireless Earbuds|30|8500|Completed
ORD-006|18/01/2024|Amara Eze|Ibadan|Groceries|Cooking Oil (5L)|40|4200|Completed
ORD-007|22/01/2024|Naomi Ajah|Abuja|Electronics|Portable Charger|15|6500|Cancelled

ORD-010|30/01/2024|Funke Adeleke|Kano|Groceries|Vegetable Oil (20L)|60|9500|Pending
ORD-011|02/02/2024|Emeka Okafor|Lagos|Electronics|Smart Watch|6|35000|Completed
ORD-012|05/02/2024|Amara Eze|Ibadan|Household|Pressure Cooker|14|14500|Completed
ORD-013|08/02/2024|Bola Adesanya|Lagos|Clothing|Children School Uniform|50|5500|Completed
ORD-014|12/02/2024|Naomi Ajah|Abuja|Electronics|Laptop Stand|20|7800|Completed
ORD-015|14/02/2024|Chidi Nwosu|Port Harcourt|Groceries|Tomato Paste (Carton)|35|11000|Pending
ORD-016|16/02/2024|Funke Adeleke|Kano|Electronics|Power Bank 20000mAh|24|9200|Completed
ORD-017|20/02/2024|Amara Eze|Ibadan|Clothing|Traditional Buba Set|10|18500|Cancelled
ORD-018|22/02/2024|Emeka Okafor|Lagos|Household|Water Dispenser|7|28000|Completed
ORD-019|26/02/2024|Bola Adesanya|Lagos|Groceries|Noodles (Carton)|80|4800|Completed
ORD-020|28/02/2024|Naomi Ajah|Abuja|Household|Electric Kettle|18|8900|Completed
ORD-021|04/03/2024|Chidi Nwosu|Port Harcourt|Electronics|Bluetooth Speaker|9|15500|Completed
ORD-022|07/03/2024|Funke Adeleke|Kano|Clothing|Men's Kaftan|16|12000|Pending
ORD-023|11/03/2024|Amara Eze|Ibadan|Groceries|Semovita (10kg)|45|3800|Completed
ORD-024|13/03/2024|Emeka Okafor|Lagos|Electronics|Wireless Mouse|22|5200|Completed
ORD-025|15/03/2024|Bola Adesanya|Lagos|Household|Iron and Board Set|11|16500|Completed
ORD-026|18/03/2024|Naomi Ajah|Abuja|Clothing|Office Blazer|6|32000|Cancelled
ORD-027|20/03/2024|Chidi Nwosu|Port Harcourt|Household|Gas Cooker|4|45000|Completed
ORD-028|22/03/2024|Funke Adeleke|Kano|Groceries|Rice (50kg)|30|24000|Completed
ORD-029|26/03/2024|Amara Eze|Ibadan|Electronics|USB Hub 7-Port|28|3500|Completed
ORD-030|29/03/2024|Bola Adesanya|Lagos|Clothing|Women's Boubou|12|14000|Pending`;
const serial=s=>{const[d,m,y]=s.split('/').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5)};
const fmtDate=n=>{const d=new Date(Date.UTC(1899,11,30)+n*864e5);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear()};
/* columns A..J: Order ID, Date, Rep, Region, Category, Product, Units, Price, Revenue, Status */
const DATA=RAW.split('\n').map(l=>{const p=l.split('|');const u=+p[6],pr=+p[7];return[p[0],serial(p[1]),p[2],p[3],p[4],p[5],u,pr,u*pr,p[8]]});
const HEAD=['Order ID','Order Date','Sales Rep','Region','Product Category','Product Name','Units Sold','Unit Price (NGN)','Revenue (NGN)','Status'];
const LET='ABCDEFGHIJ';
const NUMCOL=new Set([1,6,7,8]);
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:4});
const fmtCell=(c,v)=>c===1?fmtDate(v):(typeof v==='number'?nf.format(v):v);

/* ---------- formula engine ---------- */
class XlErr{constructor(c){this.code=c}}
const E=c=>new XlErr(c);
const isErr=v=>v instanceof XlErr;
function sheetCell(c,r){ if(r===2) return c<10?HEAD[c]:null; if(r>=3&&r<=32&&c<10) return DATA[r-3][c]; if(r===1&&c===0) return 'Zenith Consumer Goods Limited, Q1 2024 Sales Records'; return null}
const colNum=s=>{let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1};
function tokenize(src){
  const re=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|("(?:[^"]|"")*")|(\$?[A-Za-z]{1,2}\$?\d+(?::\$?[A-Za-z]{1,2}\$?\d+)?)|([A-Za-z_][A-Za-z0-9_.]*)|(<=|>=|<>|[-+*\/^&=<>(),%])|(\S))/y;
  const out=[];re.lastIndex=0;let m;
  while(re.lastIndex<src.length&&(m=re.exec(src))){
    if(m[1]!==undefined)out.push({t:'num',v:parseFloat(m[1])});
    else if(m[2]!==undefined)out.push({t:'str',v:m[2].slice(1,-1).replace(/""/g,'"')});
    else if(m[3]!==undefined)out.push({t:'ref',v:m[3]});
    else if(m[4]!==undefined)out.push({t:'id',v:m[4]});
    else if(m[5]!==undefined)out.push({t:'op',v:m[5]});
    else if(m[6]!==undefined)throw new Error('char:'+m[6]);
    else break;
  }
  return out;
}
function parse(tokens){
  let i=0;const peek=()=>tokens[i],next=()=>tokens[i++];
  const isOp=v=>peek()&&peek().t==='op'&&peek().v===v;
  function cmp(){let l=cat();while(peek()&&peek().t==='op'&&['=','<>','<','>','<=','>='].includes(peek().v)){const o=next().v;l={k:'bin',o,l,r:cat()}}return l}
  function cat(){let l=add();while(isOp('&')){next();l={k:'bin',o:'&',l,r:add()}}return l}
  function add(){let l=mul();while(isOp('+')||isOp('-')){const o=next().v;l={k:'bin',o,l,r:mul()}}return l}
  function mul(){let l=pow();while(isOp('*')||isOp('/')){const o=next().v;l={k:'bin',o,l,r:pow()}}return l}
  function pow(){let l=unary();while(isOp('^')){next();l={k:'bin',o:'^',l,r:unary()}}return l}
  function unary(){if(isOp('-')){next();return{k:'neg',e:unary()}}if(isOp('+')){next();return unary()}return post()}
  function post(){let e=prim();while(isOp('%')){next();e={k:'pct',e}}return e}
  function prim(){
    const t=next();if(!t)throw new Error('end');
    if(t.t==='num')return{k:'lit',v:t.v};
    if(t.t==='str')return{k:'lit',v:t.v};
    if(t.t==='ref')return{k:'ref',v:t.v};
    if(t.t==='id'){
      if(isOp('(')){next();const args=[];if(!isOp(')')){for(;;){if(isOp(',')||isOp(')')){args.push({k:'blank'})}else args.push(cmp());if(isOp(',')){next();continue}break}}
        if(!isOp(')'))throw new Error('paren');next();return{k:'fn',n:t.v.toUpperCase(),a:args}}
      const u=t.v.toUpperCase();if(u==='TRUE')return{k:'lit',v:true};if(u==='FALSE')return{k:'lit',v:false};
      return{k:'name',v:t.v};
    }
    if(t.t==='op'&&t.v==='('){const e=cmp();if(!isOp(')'))throw new Error('paren');next();return e}
    throw new Error('unexpected');
  }
  const e=cmp();if(i<tokens.length)throw new Error('extra');return e;
}
function refVal(s){
  const m=s.replace(/\$/g,'').match(/^([A-Za-z]+)(\d+)(?::([A-Za-z]+)(\d+))?$/);
  const c1=colNum(m[1]),r1=+m[2];
  if(!m[3])return sheetCell(c1,r1);
  const c2=colNum(m[3]),r2=+m[4];const a=[];
  for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++){const row=[];for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)row.push(sheetCell(c,r));a.push(row)}
  return{arr:a};
}
const isArr=v=>v&&typeof v==='object'&&Array.isArray(v.arr);
const flat=v=>isArr(v)?v.arr.flat():[v];
function num(v){
  if(isErr(v))throw v;
  if(isArr(v)){const f=v.arr.flat();if(f.length===1)return num(f[0]);throw E('#VALUE!')}
  if(v===null||v===undefined||v==='')return 0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(ch){

function renderQ(){
  const box=$('#qbox');if(!box)return;

function viewRows(){

function passes(row){
  for(const c in S.filt){const f=S.filt[c];if(!f)continue;const v=row[c];

}

function drawCard(){
  // prefer cards not yet known
  const unk=cd.order.filter(i=>!P.cards[i]);
  if(unk.length&&P.cards[cd.order[cd.i]]){const j=cd.order.findIndex((x,k)=>k>cd.i&&!P.cards[x]);cd.i=j>=0?j:cd.order.findIndex(x=>!P.cards[x])}
  const c=CARDS[cd.order[cd.i]];cd.flip=false;$('#card').classList.remove('flip');
  $('#cf').textContent=c[0];$('#cbk').textContent=c[1];
  const known=Object.keys(P.cards).length;$('#cn').textContent=`Card ${cd.i+1} of ${CARDS.length}`;$('#ck').textContent=`${known} of ${CARDS.length} known`;$('#cb').style.width=known/CARDS.length*100+'%';
}

/* boot */
window.__lab={evalFormula,MISSIONS,DATA,showVal,same};
paint();
const hs=(location.hash||'').slice(1);setTab(['quiz','sheet','lab','cards'].includes(hs)?hs:'quiz',false);
</script>
